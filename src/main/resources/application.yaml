spring:
  application:
    name: xin-ai-code-mother-backend
#循环依赖允许注释
#  main:
#    allow-circular-references: true
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000


  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/xin_ai_code_mother
    username: root
    password: 1234

  # redis
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      ttl: 3600

  profiles:
    active:
      - local

server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000

# springdoc-openapi 配置
springdoc:
  group-configs:
    - group: 'default'
      # ✅ 必须用数组格式（短横线 + 空格）
      paths-to-match:
        - '/**'
      packages-to-scan:
        - com.lixin.xinaicodemother.controller

# knife4j 增强配置
knife4j:
  enable: true
  setting:
    language: zh_cn